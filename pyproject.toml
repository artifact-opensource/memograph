[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memograph"
version = "0.2.0"
description = "Topological Memory Management Framework for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Memograph Contributors"},
]
license = {text = "MIT"}
keywords = ["memory", "ai", "agent", "topology", "rag", "context"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Artificial Intelligence",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
hektor = [
    "httpx>=0.24.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/yourorg/memograph"
Repository = "https://github.com/yourorg/memograph"
Documentation = "https://github.com/yourorg/memograph/tree/main/docs"
Issues = "https://github.com/yourorg/memograph/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["memograph*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"